<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Global Trends</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}
h1{
color:#00c896;
}
.card{
background:#1e293b;
padding:15px;
margin-bottom:12px;
border-radius:12px;
}
.source{
color:#00c896;
font-size:12px;
}
button{
padding:10px;
border:none;
background:#00c896;
color:white;
border-radius:8px;
margin-bottom:15px;
}
</style>

</head>
<body>

<h1>🔥 Global Trends</h1>
<button onclick="loadTrends()">Load Real Trends</button>

<div id="content"></div>

<script>

async function loadTrends(){
const container = document.getElementById("content");
container.innerHTML="Loading real trends...";

container.innerHTML="";


// ===== Google Trends US =====
let googleRSS = "https://trends.google.com/trending/rss?geo=US";
let googleAPI = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(googleRSS);

let googleRes = await fetch(googleAPI);
let googleData = await googleRes.json();

googleData.items.slice(0,5).forEach(item=>{
container.innerHTML+=`
<div class="card">
<div class="source">Google Trends</div>
<h3>${item.title}</h3>
</div>
`;
});


// ===== Reddit News =====
let redditRSS = "https://www.reddit.com/r/news/.rss";
let redditAPI = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(redditRSS);

let redditRes = await fetch(redditAPI);
let redditData = await redditRes.json();

redditData.items.slice(0,5).forEach(item=>{
container.innerHTML+=`
<div class="card">
<div class="source">Reddit</div>
<h3>${item.title}</h3>
</div>
`;
});

}

</script>

</body>
</html>
